apiVersion: apps/v1
kind: Deployment
metadata:
  name: zoya-deployment
  namespace: zoya-shopping
  labels:
    app: zoya
spec:
  replicas: 2
  selector:
    matchLabels:
      app: zoya
  template:
    metadata:
      labels:
        app: zoya
    spec:
      containers:
        - name: zoya-container
          image: psreddy2508/zoya:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
